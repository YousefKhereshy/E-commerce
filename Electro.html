<style>
/* Layout: sticky bar (logo, search, cart) > trust strip > compact hero with category chips > filter toolbar > product grid; cart is a side drawer, product details a centered sheet. */
:root{
  --bg:#EDF0F3; --card:#FFFFFF; --ink:#0E1621; --muted:#5A6676; --line:#D7DDE4;
  --accent:#F25C05; --accent-ink:#FFFFFF; --good:#127A3E; --good-bg:#DDF3E5; --bad:#B42318;
  --art-s:32%; --art-l:92%;
  --f-display:'Readex Pro','IBM Plex Sans Arabic',system-ui,sans-serif;
  --f-body:'IBM Plex Sans Arabic',system-ui,'Segoe UI',Tahoma,sans-serif;
  --shadow:0 12px 40px rgba(14,22,33,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1118; --card:#141C26; --ink:#EDF1F6; --muted:#9AA6B6; --line:#243040;
    --accent:#FF7A2E; --accent-ink:#1A0A00; --good:#5FD38D; --good-bg:#12301F; --bad:#FF8A80;
    --art-s:22%; --art-l:20%; --shadow:0 12px 40px rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1118; --card:#141C26; --ink:#EDF1F6; --muted:#9AA6B6; --line:#243040;
  --accent:#FF7A2E; --accent-ink:#1A0A00; --good:#5FD38D; --good-bg:#12301F; --bad:#FF8A80;
  --art-s:22%; --art-l:20%; --shadow:0 12px 40px rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;padding-inline:16px;position:relative;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{position:relative;z-index:1}
.wrap{max-width:1180px;margin-inline:auto}
.num{font-variant-numeric:tabular-nums}
#asciiBackground{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:.22;filter:blur(.1px)}
#asciiBackground .matrix{position:absolute;inset:-45%;width:max-content;transform:rotate(10deg) scale(1.18);font-family:Consolas,"Courier New",monospace;font-size:12px;line-height:1.1;letter-spacing:2px;color:rgba(242,92,5,.7);white-space:pre;text-shadow:0 0 10px rgba(242,92,5,.35);animation:asciiFloat 18s linear infinite}
@keyframes asciiFloat{0%{transform:rotate(10deg) translate3d(-2%,0,0) scale(1.18)}50%{transform:rotate(12deg) translate3d(2%,2%,0) scale(1.24)}100%{transform:rotate(10deg) translate3d(-2%,0,0) scale(1.18)}}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.bar .wrap{display:grid;grid-template-columns:auto 1fr auto;gap:12px 16px;align-items:center;padding-block:12px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:-.01em}
.logo svg{width:28px;height:28px}
.search{position:relative;min-width:0}
.search input{width:100%;height:44px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding-inline:44px 14px}
.search svg{position:absolute;inset-inline-start:13px;top:50%;translate:0 -50%;width:20px;height:20px;color:var(--muted);pointer-events:none}
.cart-btn{position:relative;height:44px;display:flex;align-items:center;gap:8px;padding-inline:14px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:10px;font-weight:600}
.cart-btn svg{width:20px;height:20px}
.cart-btn .count{min-width:22px;height:22px;border-radius:11px;background:var(--accent);color:var(--accent-ink);font-size:12px;display:grid;place-items:center;padding-inline:6px}
@media (max-width:620px){.search{grid-column:1/-1;order:3}.cart-btn .lbl{display:none}}

/* trust strip */
.strip{display:flex;flex-wrap:wrap;gap:6px 22px;padding-block:10px;font-size:13px;color:var(--muted)}
.strip span{display:flex;align-items:center;gap:6px}
.strip i{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block}

/* hero */
.hero{padding-block:22px 10px;display:grid;gap:18px}
.hero h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,5vw,44px);line-height:1.2;margin:0;text-wrap:balance;max-width:20ch}
.hero p{margin:0;color:var(--muted);max-width:52ch}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font-weight:500;display:flex;gap:8px;align-items:center}
.chip small{color:var(--muted);font-size:12px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.7}

/* toolbar */
.tools{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding-block:16px 12px;border-top:1px solid var(--line);margin-top:10px}
.tools .res{color:var(--muted);font-size:14px}
.tools .ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tools select{height:40px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding-inline:10px}
.tog{display:flex;gap:8px;align-items:center;font-size:14px}
.tog input{width:18px;height:18px;accent-color:var(--accent)}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:14px;padding-bottom:40px}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.art{position:relative;display:block;width:100%;border:0;padding:0;background:hsl(var(--h) var(--art-s) var(--art-l));aspect-ratio:4/3;overflow:hidden}
.art svg,.art img{width:100%;height:100%;display:block}
.art img{object-fit:cover;filter:saturate(1.06) contrast(1.04)}
.tags{position:absolute;inset-block-start:8px;inset-inline-start:8px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.tag{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--accent);color:var(--accent-ink)}
.tag.alt{background:var(--ink);color:var(--bg)}
.tag.out{background:var(--bad);color:#fff}
.info{padding:12px;display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.brand{font-size:12px;color:var(--muted);letter-spacing:.04em}
.info h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:15.5px;line-height:1.4;text-wrap:balance}
.specs{margin:0;font-size:13px;color:var(--muted)}
.buy{margin-top:auto;padding-top:10px;display:flex;flex-direction:column;gap:8px}
.price{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}
.price b{font-family:var(--f-display);font-size:19px;font-weight:700}
.price small{font-size:12px;color:var(--muted)}
.price s{font-size:13px;color:var(--muted)}
.add{height:40px;border-radius:8px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600}
.add:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
.add.done{background:var(--good);color:#fff}
.empty{grid-column:1/-1;padding:48px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}

footer{border-top:1px solid var(--line);padding-block:20px 32px;color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(6,10,15,.55);z-index:30}
.drawer{position:fixed;inset-block:0;inset-inline-end:0;width:min(440px,100%);background:var(--bg);z-index:31;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font-family:var(--f-display);font-size:19px}
.x{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.x svg{width:18px;height:18px}
.db{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.line{display:grid;grid-template-columns:64px 1fr;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
.line .th{width:64px;height:64px;border-radius:8px;background:hsl(var(--h) var(--art-s) var(--art-l))}
.line .th svg{width:100%;height:100%}
.line .nm{font-weight:600;font-size:14px;line-height:1.4}
.line .rw{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:8px}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px}
.qty button{width:32px;height:32px;border:0;background:transparent;font-size:18px}
.qty span{min-width:28px;text-align:center}
.rm{border:0;background:none;color:var(--bad);font-size:13px;padding:4px}
.tot{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:6px}
.tot div{display:flex;justify-content:space-between}
.tot .g{font-family:var(--f-display);font-weight:700;font-size:18px;border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.hint{font-size:13px;color:var(--muted)}
.hint.ok{color:var(--good)}
.form{display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:13px;font-weight:500}
.form input,.form textarea{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:10px 12px;width:100%}
.form textarea{min-height:68px;resize:vertical}
.err{color:var(--bad);font-size:13px;min-height:1.2em;margin:0}
.df{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:grid;gap:8px;background:var(--bg)}
.wa{height:46px;border-radius:10px;background:#1FA855;color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center;text-decoration:none;border:0}
.wa[aria-disabled="true"]{opacity:.5}
.ghost{height:40px;border-radius:8px;border:1px solid var(--line);background:var(--card)}
.note{font-size:12.5px;color:var(--muted);margin:0}
.sheet{position:fixed;z-index:31;inset-inline:16px;top:50%;translate:0 -50%;max-width:760px;margin-inline:auto;max-height:calc(100% - 32px);overflow:auto;background:var(--card);border-radius:14px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr 1fr}
.sheet .art{aspect-ratio:auto;min-height:260px;height:100%}
.sheet .body{padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.sheet h2{margin:0;font-family:var(--f-display);font-size:21px;line-height:1.35}
.sheet ul{margin:0;padding-inline-start:20px;color:var(--muted)}
.stock{font-size:13px;font-weight:600;color:var(--good)}
.stock.no{color:var(--bad)}
.sheet .x{position:absolute;inset-block-start:10px;inset-inline-end:10px}
@media (max-width:620px){.sheet{grid-template-columns:1fr;top:auto;bottom:0;translate:none;inset-inline:0;max-height:92%;border-radius:14px 14px 0 0}.sheet .art{min-height:0;aspect-ratio:16/9}}
*{border-radius:0!important}
button,input,select,textarea{border-width:1px;border-style:solid;border-color:var(--line)}
*:hover{border-color:var(--accent)}
.add:not(.done):not(:disabled):hover{border-color:#0B1118}
.cart-btn{border-color:var(--ink)}
.add{border-color:var(--accent)}
.wa{border-color:#1FA855}
.rm{border-color:var(--bad)}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .22s ease-out}@keyframes slide{from{transform:translateX(-24px);opacity:0}}}
</style>

];
var S={cat:'all',q:'',sort:'featured',stock:false,cart:{}};
var $=function(s){return document.querySelector(s)};
var fmt=function(n){return n.toLocaleString('en-US')};
var byId=function(id){return P.filter(function(p){return p.id===id})[0]};

function art(p){
  if(p && p.image){
    return '<img src="'+p.image+'" alt="'+p.name+'" loading="lazy" decoding="async">';
  }
  var c=(p&&p.cat)||'phone';
  var T='fill="hsl(var(--h) 62% 52%)"', B='fill="var(--card)" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"', sh={
  phone:'<rect x="68" y="12" width="64" height="126" rx="12" '+B+'/><rect x="75" y="22" width="50" height="98" rx="6" '+T+'/><circle cx="100" cy="129" r="3" fill="var(--ink)"/>',
  laptop:'<rect x="45" y="24" width="110" height="74" rx="6" '+B+'/><rect x="53" y="32" width="94" height="58" rx="2" '+T+'/><path d="M26 106h148l-10 14H36z" '+B+'/>',
  audio:'<path d="M52 92V80a48 48 0 0 1 96 0v12" fill="none" stroke="var(--ink)" stroke-width="7" stroke-linecap="round"/><rect x="38" y="86" width="24" height="42" rx="10" '+B+'/><rect x="138" y="86" width="24" height="42" rx="10" '+B+'/><rect x="44" y="96" width="12" height="22" rx="5" '+T+'/><rect x="144" y="96" width="12" height="22" rx="5" '+T+'/>',
  watch:'<rect x="80" y="4" width="40" height="34" rx="6" '+T+'/><rect x="80" y="112" width="40" height="34" rx="6" '+T+'/><rect x="64" y="32" width="72" height="86" rx="20" '+B+'/><rect x="71" y="39" width="58" height="72" rx="14" fill="var(--bg)" stroke="none"/><path d="M100 58v18l13 9" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>',
  power:'<rect x="60" y="18" width="80" height="114" rx="14" '+B+'/><path d="M106 44 88 76h14l-6 26 22-36h-15z" '+T+'/><circle cx="82" cy="118" r="3.5" fill="var(--ink)"/><circle cx="94" cy="118" r="3.5" fill="var(--ink)"/><circle cx="106" cy="118" r="3.5" fill="var(--ink)"/>',
  game:'<path d="M60 46h80c25 0 38 36 44 64 2 12-11 18-19 9l-16-21H71l-16 21c-8 9-21 3-19-9 6-28 19-64 24-64z" '+B+'/><path d="M72 68h9v-9h9v9h9v9h-9v9h-9v-9h-9z" '+T+'/><circle cx="124" cy="66" r="6" '+T+'/><circle cx="138" cy="80" r="6" '+T+'/>'};
  return '<svg viewBox="0 0 200 150" aria-hidden="true">'+(sh[c]||sh.phone)+'</svg>';
}
function disc(p){return p.old?Math.round((1-p.price/p.old)*100):0}

function renderChips(){
  $('#chips').innerHTML=CATS.map(function(c){
    var n=c[0]==='all'?P.length:P.filter(function(p){return p.cat===c[0]}).length;
    return '<button class="chip" data-cat="'+c[0]+'" aria-pressed="'+(S.cat===c[0])+'">'+c[1]+' <small class="num">'+n+'</small></button>';
  }).join('');
}
function list(){
  var q=S.q.trim().toLowerCase();
  var r=P.filter(function(p){
    if(S.cat!=='all'&&p.cat!==S.cat)return false;
    if(S.stock&&!p.stock)return false;
    if(q&&(p.name+' '+p.brand+' '+p.specs.join(' ')).toLowerCase().indexOf(q)<0)return false;
    return true;
  });
  var s=S.sort;
  r.sort(function(a,b){
    if(s==='low')return a.price-b.price;
    if(s==='high')return b.price-a.price;
    if(s==='disc')return disc(b)-disc(a);
    return (b.hot-a.hot)||(a.id-b.id);
  });
  return r;
}
function card(p){
  var d=disc(p);
  return '<article class="card"><button class="art" style="--h:'+p.h+'" data-open="'+p.id+'" aria-label="تفاصيل '+p.name+'">'+art(p)+
  '<span class="tags">'+(p.stock?'':'<span class="tag out">نفد</span>')+(d?'<span class="tag num">خصم '+d+'%</span>':'')+(p.hot&&p.stock?'<span class="tag alt">الأكثر طلباً</span>':'')+'</span></button>'+
  '<div class="info"><span class="brand" dir="ltr" style="text-align:start">'+p.brand+'</span><h3>'+p.name+'</h3><p class="specs">'+p.specs.join(' · ')+'</p>'+
  '<div class="buy"><div class="price num"><b>'+fmt(p.price)+'</b><small>'+CONFIG.cur+'</small>'+(p.old?'<s>'+fmt(p.old)+'</s>':'')+'</div>'+
  '<button class="add" data-add="'+p.id+'"'+(p.stock?'':' disabled')+'>'+(p.stock?'أضف للسلة':'غير متوفر')+'</button></div></div></article>';
}
function renderGrid(){
  var r=list();
  $('#res').textContent=r.length+' منتج';
  $('#grid').innerHTML=r.length?r.map(card).join(''):'<div class="empty">لا توجد منتجات مطابقة. جرّب كلمة أخرى أو غيّر التصنيف.</div>';
}

/* cart */
function save(){try{localStorage.setItem('volt-cart',JSON.stringify(S.cart))}catch(e){}}
function load(){try{var c=JSON.parse(localStorage.getItem('volt-cart')||'{}');Object.keys(c).forEach(function(k){var p=byId(+k);if(p&&p.stock&&c[k]>0)S.cart[k]=Math.min(c[k],p.stock)})}catch(e){}}
function lines(){return Object.keys(S.cart).map(function(k){return {p:byId(+k),q:S.cart[k]}})}
function totals(){var sub=0,n=0;lines().forEach(function(l){sub+=l.p.price*l.q;n+=l.q});var ship=sub===0||sub>=CONFIG.freeFrom?0:CONFIG.shipping;return{sub:sub,ship:ship,total:sub+ship,n:n}}
function add(id,d){
  var p=byId(id),cur=S.cart[id]||0,nx=Math.max(0,Math.min(p.stock,cur+d));
  if(nx===0)delete S.cart[id];else S.cart[id]=nx;
  save();renderCart();
}
function orderText(){
  var t=totals(),f=getForm();
  var rows=lines().map(function(l){return '- '+l.p.name+' × '+l.q+' = '+fmt(l.p.price*l.q)+' '+CONFIG.cur}).join('\n');
  return 'طلب جديد من '+CONFIG.name+'\n\n'+rows+'\n\nالمنتجات: '+fmt(t.sub)+' '+CONFIG.cur+'\nالشحن: '+(t.ship?fmt(t.ship)+' '+CONFIG.cur:'مجاني')+'\nالإجمالي: '+fmt(t.total)+' '+CONFIG.cur+'\nالدفع: عند الاستلام\n\nالاسم: '+f.name+'\nالهاتف: '+f.phone+'\nالعنوان: '+f.addr+(f.note?'\nملاحظات: '+f.note:'');
}
function getForm(){
  var g=function(id){var e=document.getElementById(id);return e?e.value.trim():''};
  return {name:g('fName'),phone:g('fPhone'),addr:g('fAddr'),note:g('fNote')};
}
function valid(){
  var f=getForm();
  if(f.name.length<2)return 'اكتب اسمك.';
  if(f.phone.replace(/\D/g,'').length<10)return 'اكتب رقم هاتف صحيح للتواصل.';
  if(f.addr.length<8)return 'اكتب العنوان بالتفصيل (المحافظة، المنطقة، الشارع).';
  return '';
}
function syncLink(){
  var a=$('#waLink');if(!a)return;
  a.href='https://wa.me/'+CONFIG.whatsapp+'?text='+encodeURIComponent(orderText());
  a.setAttribute('aria-disabled',valid()?'true':'false');
}
function renderCart(){
  var t=totals();
  $('#cartCount').textContent=t.n;
  var body=$('#cartBody'),foot=$('#cartFoot');
  var keep=getForm();
  if(!t.n){body.innerHTML='<div class="empty">السلة فارغة. أضف منتجات من القائمة.</div>';foot.hidden=true;return}
  var need=CONFIG.freeFrom-t.sub;
  body.innerHTML=lines().map(function(l){
    return '<div class="line"><div class="th" style="--h:'+l.p.h+'">'+art(l.p)+'</div><div><div class="nm">'+l.p.name+'</div>'+
    '<div class="rw"><div class="qty"><button data-dec="'+l.p.id+'" aria-label="إنقاص">−</button><span class="num">'+l.q+'</span><button data-inc="'+l.p.id+'" aria-label="زيادة">+</button></div><b class="num">'+fmt(l.p.price*l.q)+' '+CONFIG.cur+'</b></div>'+
    '<button class="rm" data-rm="'+l.p.id+'">حذف</button></div></div>';
  }).join('')+
  '<div class="tot num"><div><span>المنتجات</span><span>'+fmt(t.sub)+' '+CONFIG.cur+'</span></div><div><span>الشحن</span><span>'+(t.ship?fmt(t.ship)+' '+CONFIG.cur:'مجاني')+'</span></div><div class="g"><span>الإجمالي</span><span>'+fmt(t.total)+' '+CONFIG.cur+'</span></div></div>'+
  '<p class="hint num'+(need<=0?' ok':'')+'">'+(need<=0?'الشحن مجاني على هذا الطلب.':'أضف منتجات بقيمة '+fmt(need)+' '+CONFIG.cur+' للحصول على شحن مجاني.')+'</p>'+
  '<div class="form"><label for="fName">الاسم<input id="fName" autocomplete="name"></label><label for="fPhone">رقم الهاتف<input id="fPhone" type="tel" inputmode="tel" autocomplete="tel" dir="ltr" style="text-align:start"></label><label for="fAddr">العنوان بالتفصيل<textarea id="fAddr" autocomplete="street-address"></textarea></label><label for="fNote">ملاحظات (اختياري)<input id="fNote"></label></div>';
  ['name','phone','addr','note'].forEach(function(k){var m={name:'fName',phone:'fPhone',addr:'fAddr',note:'fNote'};$('#'+m[k]).value=keep[k]});
  foot.hidden=false;syncLink();
}

/* overlays */
function show(el,on){el.hidden=!on;$('#scrim').hidden=!(on||!$('#drawer').hidden||!$('#sheet').hidden)}
function openCart(){$('#sheet').hidden=true;$('#drawer').hidden=false;$('#scrim').hidden=false;renderCart();$('#closeCart').focus()}
function closeAll(){$('#drawer').hidden=true;$('#sheet').hidden=true;$('#scrim').hidden=true}
function openSheet(id){
  var p=byId(id),d=disc(p);
  $('#sheet').innerHTML='<div class="art" style="--h:'+p.h+'">'+art(p)+'</div><div class="body"><span class="brand" dir="ltr" style="text-align:start">'+p.brand+'</span><h2>'+p.name+'</h2>'+
  '<ul>'+p.specs.map(function(s){return '<li>'+s+'</li>'}).join('')+'</ul>'+
  '<div class="price num"><b>'+fmt(p.price)+'</b><small>'+CONFIG.cur+'</small>'+(p.old?'<s>'+fmt(p.old)+'</s> <span class="tag">خصم '+d+'%</span>':'')+'</div>'+
  '<div class="stock'+(p.stock?'':' no')+'">'+(p.stock?(p.stock<=5?'متبقي '+p.stock+' فقط':'متوفر'):'غير متوفر حالياً')+'</div>'+
  '<button class="add" data-add="'+p.id+'"'+(p.stock?'':' disabled')+'>'+(p.stock?'أضف للسلة':'غير متوفر')+'</button></div>'+
  '<button class="x" id="closeSheet" aria-label="إغلاق"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>';
  $('#sheet').hidden=false;$('#scrim').hidden=false;$('#closeSheet').focus();
}

/* events */
document.addEventListener('click',function(e){
  var t=e.target.closest('button,a,.scrim');if(!t)return;
  var d=t.dataset||{};
  if(d.cat){S.cat=d.cat;renderChips();renderGrid();return}
  if(d.open){openSheet(+d.open);return}
  if(d.add){
    var id=+d.add;add(id,1);
    var old=t.textContent;t.classList.add('done');t.textContent='تمت الإضافة';
    setTimeout(function(){t.classList.remove('done');t.textContent=old},1100);return;
  }
  if(d.inc){add(+d.inc,1);return}
  if(d.dec){add(+d.dec,-1);return}
  if(d.rm){delete S.cart[d.rm];save();renderCart();return}
  if(t.id==='openCart'){openCart();return}
  if(t.id==='closeCart'||t.id==='closeSheet'||t.id==='scrim'){closeAll();return}
  if(t.id==='waLink'){
    var er=valid();$('#err').textContent=er;
    if(er){e.preventDefault();return}
    $('#sentNote').textContent='تم فتح واتساب. أرسل الرسالة هناك ليصلنا الطلب ونؤكده معك.';return;
  }
  if(t.id==='copyOrder'){
    var er2=valid();$('#err').textContent=er2;if(er2)return;
    var txt=orderText();
    var ok=function(){$('#sentNote').textContent='تم نسخ نص الطلب. الصقه في محادثة واتساب على الرقم '+CONFIG.whatsapp+'.'};
    var no=function(){$('#sentNote').textContent='تعذر النسخ تلقائياً. استخدم زر واتساب بدلاً منه.'};
    try{navigator.clipboard.writeText(txt).then(ok,no)}catch(x){no()}
  }
});
document.addEventListener('input',function(e){
  if(e.target.id==='q'){S.q=e.target.value;renderGrid()}
  else if(e.target.closest&&e.target.closest('.form')){$('#err').textContent='';syncLink()}
});
$('#sort').addEventListener('change',function(e){S.sort=e.target.value;renderGrid()});
$('#onlyStock').addEventListener('change',function(e){S.stock=e.target.checked;renderGrid()});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeAll()});

var asciiChars='01#@*+=-:./\\|_~^%$[]{}<>!?';
var asciiShapes=[
  ['  .-.  ',' (   ) ','  `-`  '],
  [' /\\ ','<  >',' \\/ '],
  ['+---+','| * |','+---+'],
  ['  /\\  ',' /  \\ ','<    >',' \\  / ','  \\/  '],
  ['--+--','  |  ','--+--'],
  [' .--. ','(    )',' `--` '],
  ['  __',' /  \\','| () |',' \\__/'],
  [' _|_ ','--+--','  |  '],
  ['  /|',' / |','/__|'],
  ['<===>','  |  ','<===>']
];
function buildAsciiBackground(){
  var matrix=$('#asciiMatrix');
  if(!matrix)return;
  var cols=Math.ceil(window.innerWidth*2/(12*.62+2));
  var rows=Math.ceil(window.innerHeight*2/(12*1.1));
  var canvas=[];
  for(var i=0;i<rows;i++){
    canvas[i]=[];
    for(var j=0;j<cols;j++){
      canvas[i][j]=asciiChars[Math.floor(Math.random()*asciiChars.length)];
    }
  }
  for(var n=0;n<34;n++){
    var shape=asciiShapes[Math.floor(Math.random()*asciiShapes.length)];
    var top=Math.floor(Math.random()*(rows-shape.length));
    var left=Math.floor(Math.random()*(cols-12));
    for(var y=0;y<shape.length;y++){
      for(var x=0;x<shape[y].length;x++){
        if(shape[y][x]!==' ')canvas[top+y][left+x]=shape[y][x];
      }
    }
  }
  matrix.textContent=canvas.map(function(row){return row.join('')}).join('\n');
}
buildAsciiBackground();
setInterval(buildAsciiBackground, 2200);
window.addEventListener('resize',buildAsciiBackground);

$('#storeName').textContent=CONFIG.name;
$('#waShown').textContent='+'+CONFIG.whatsapp;
load();renderChips();renderGrid();renderCart();
</script>
